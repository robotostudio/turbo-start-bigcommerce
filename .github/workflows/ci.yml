name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Hand-triggerable from the Actions tab or `gh workflow run CI --ref main`.
  # Added while diagnosing why no run had ever started: with only `push` and
  # `pull_request`, the only way to test whether runs execute at all is to push
  # again and hope, and a run that never appears looks the same as a run that
  # was never triggered. This separates the two.
  #
  # GitHub only offers the trigger once the workflow carrying it is on the
  # default branch, so this does nothing until it is merged to `main`.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Format, Type Check & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # No `version` input on purpose: pnpm/action-setup reads the version from
      # the root package.json `packageManager` field. Passing both makes it
      # throw "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build against the checked-in examples with env validation ON (no
      # SKIP_ENV_VALIDATION). If an example drifts out of sync with the env
      # schema, the build below fails and says so.
      - name: Seed env from examples
        run: |
          cp apps/web/.env.example apps/web/.env.local
          cp apps/studio/.env.example apps/studio/.env
          # Removed during the BigCommerce conversion; absence is not an error.
          if [ -f packages/sanity/.env.example ]; then
            cp packages/sanity/.env.example packages/sanity/.env
          fi

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm check-types

      - run: pnpm build

      - run: pnpm test

      # Fails on any leftover from the platform this was ported off, and on any
      # live-system identifier. Strict since the tree reached zero; the prose
      # that records how the port was decided is exempt by pathspec, and the
      # `gid://shopify` literals in tests are exempt line by line because
      # rejecting a legacy id is the assertion there.
      - name: Forbidden references
        run: ./scripts/check-forbidden-refs.sh --strict
