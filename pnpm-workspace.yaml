packages:
  - apps/*
  - packages/*

catalog:
  # Held at 7.x (8.3.0 is out): next-sanity@13.3.3 imports `unstable__adapter`
  # from @sanity/client, which v8 removed -- next build dies loading
  # next.config.ts. Lift when next-sanity ships a v8-compatible release.
  "@sanity/client": ^7.28.0
  "@tailwindcss/postcss": ^4.3.5
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  lucide-react: ^1.73.0
  next-themes: ^0.4.6
  react: ^19.3.0
  react-dom: ^19.3.0
  # Held at 6.9.1 (6.11.0 is out) together with the studio's @sanity/ui ^3 and
  # @sanity/icons ^3 pins: sanity >=6.9.2 requires @sanity/ui v4, and
  # sanity-plugin-lucide-icon-picker@1.0.3 (latest, unmaintained) imports
  # Menu/MenuItem/Popover/Autocomplete from the @sanity/ui root and
  # Trash/Sync/EllipsisHorizontal from the @sanity/icons root -- all removed in
  # those majors. Drop or replace that plugin to lift this.
  #
  # Exact, not a caret: 6.10.x pulls @sanity/ui v4 too. The studio's
  # @sanity/vision and @sanity/orderable-document-list are exact for the same
  # reason -- orderable 2.0.21+ imports DocumentVersionsStatusIndicator, which
  # only sanity 6.11 exports.
  sanity: 6.9.1
  tailwindcss: ^4.3.5
  tw-animate-css: ^1.4.0
  typescript: 5.9.3
  vitest: ^4.1.12
  zod: ^4.6.7

# Each parent below pins an exact vulnerable version, and no release of the
# parent reachable from sanity 6.9.1 (-> @sanity/cli ^7.18.0, the last 7.x)
# fixes it. All stay inside the pinned major.
overrides:
  # GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh (high).
  # @vercel/frameworks pins 3.13.1 up to its latest (3.35.0); @sanity/cli pins
  # @vercel/frameworks 3.29.0. Remove once @vercel/frameworks pins >=3.15.2.
  "@vercel/frameworks>js-yaml": ^3.15.2
  # GHSA-7w5x-hrqm-74c2 (high). Same parent, pins 1.5.2. Remove once
  # @vercel/frameworks pins >=1.9.0.
  "@vercel/frameworks>smol-toml": ^1.9.1
  # GHSA-4cwx-7wf7-3272, GHSA-rfgv-xxqx-mfg5, GHSA-2m5v-pch6-74hx and four more
  # (high). @module-federation/dts-plugin 2.8.1 pins 7.28.0; it comes in through
  # @sanity/cli 7 -> @sanity/workbench-cli 1.x -> @module-federation/vite 1.20.1.
  # Remove once sanity is past 6.9.1 (@sanity/cli 8 -> dts-plugin 2.9.3, which
  # pins 7.30.1).
  "@module-federation/dts-plugin>undici": ^7.30.1
  # GHSA-8238-w5pm-2374, GHSA-j5f4-cc29-5x44, GHSA-rcw4-f5rp-g42v,
  # GHSA-7q85-xj36-vmfc (high). Same parent, pins 0.6.0; remove with the
  # undici entry above.
  "@module-federation/dts-plugin>adm-zip": ^0.6.1

# core-js-pure's postinstall is only a funding banner, so it stays off.
allowBuilds:
  "@tailwindcss/oxide": true
  core-js-pure: false
  esbuild: true
  sharp: true

# pnpm appends to this itself on each resolution; the entries age out and can
# be pruned whenever the lockfile is rebuilt.
minimumReleaseAgeExclude:
  - '@next/env@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - '@sanity/blueprints@0.24.0'
  - '@sanity/functions@1.6.9'
  - '@tanstack/query-core@5.102.5'
  - '@tanstack/react-query@5.102.5'
  - '@turbo/darwin-64@2.10.12'
  - '@turbo/darwin-arm64@2.10.12'
  - '@turbo/gen@2.10.12'
  - '@turbo/linux-64@2.10.12'
  - '@turbo/linux-arm64@2.10.12'
  - '@turbo/windows-64@2.10.12'
  - '@turbo/windows-arm64@2.10.12'
  - next@16.3.3
  - turbo@2.10.12
