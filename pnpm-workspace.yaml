packages:
  - apps/*
  - packages/*

catalog:
  # Held at 7.x (8.3.0 is out): next-sanity@13.3.3 imports `unstable__adapter`
  # from @sanity/client, which v8 removed -- next build dies loading
  # next.config.ts. Lift when next-sanity ships a v8-compatible release.
  "@sanity/client": ^7.26.2
  "@tailwindcss/postcss": ^4.3.3
  "@types/node": ^26.3.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  lucide-react: ^1.34.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  # Held at 6.9.1 (6.11.0 is out) together with the studio's @sanity/ui ^3 and
  # @sanity/icons ^3 pins: sanity >=6.9.2 requires @sanity/ui v4, and
  # sanity-plugin-lucide-icon-picker@1.0.3 (latest, unmaintained) imports
  # Menu/MenuItem/Popover/Autocomplete from the @sanity/ui root and
  # Trash/Sync/EllipsisHorizontal from the @sanity/icons root -- all removed in
  # those majors. Drop or replace that plugin to lift this.
  #
  # Exact, not a caret: 6.10.x pulls @sanity/ui v4 too. The studio's
  # @sanity/vision and @sanity/orderable-document-list are exact for the same
  # reason -- orderable 2.0.21+ imports DocumentVersionsStatusIndicator, which
  # only sanity 6.11 exports.
  sanity: 6.9.1
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: 5.9.3
  vitest: ^4.1.11
  zod: ^4.4.3

# core-js-pure's postinstall is only a funding banner, so it stays off.
allowBuilds:
  "@tailwindcss/oxide": true
  core-js-pure: false
  esbuild: true
  sharp: true

# pnpm appends to this itself on each resolution; the entries age out and can
# be pruned whenever the lockfile is rebuilt.
minimumReleaseAgeExclude:
  - '@next/env@16.3.3'
  - '@next/swc-darwin-arm64@16.3.3'
  - '@next/swc-darwin-x64@16.3.3'
  - '@next/swc-linux-arm64-gnu@16.3.3'
  - '@next/swc-linux-arm64-musl@16.3.3'
  - '@next/swc-linux-x64-gnu@16.3.3'
  - '@next/swc-linux-x64-musl@16.3.3'
  - '@next/swc-win32-arm64-msvc@16.3.3'
  - '@next/swc-win32-x64-msvc@16.3.3'
  - '@sanity/blueprints@0.24.0'
  - '@sanity/functions@1.6.9'
  - '@tanstack/query-core@5.102.5'
  - '@tanstack/react-query@5.102.5'
  - '@turbo/darwin-64@2.10.12'
  - '@turbo/darwin-arm64@2.10.12'
  - '@turbo/gen@2.10.12'
  - '@turbo/linux-64@2.10.12'
  - '@turbo/linux-arm64@2.10.12'
  - '@turbo/windows-64@2.10.12'
  - '@turbo/windows-arm64@2.10.12'
  - next@16.3.3
  - turbo@2.10.12
